# Copy this file to "vnaaats.cfg" in the same folder as VatsimNAAATS.dll and fill it in.
# Never commit vnaaats.cfg - it holds your secret key.
server=https://vnaaats.com
key=PASTE_YOUR_API_KEY_HERE

# autotype=1 lets the web Flight Data Display type .selcal, .contactme and the natTrak .msg into EuroScope for you,
# and lets your EuroScope send the automatic RCL REQ reminders to pilots that have not requested clearance.
# (only works while EuroScope is the active window). Leave at 0 to use copy-and-paste instead.
autotype=1

# retrack=1 (default): after a EuroScope crash or lost connection, track the aircraft you had again (not ones another controller has).
# It also tracks an aircraft again if its pilot disconnects and comes back within 5 minutes (same Flight Level, Mach and SELCAL).
# Put retrack=0 here to turn it all off.

# remotelog=1 (default): the plugin sends its warnings and errors, and the end of the last session's log, to the vNAAATS server
# so problems can be found quickly (never your key or any password). remotelog=0 turns it off, remotelog=2 sends every log line.

# autoclick=1 (default): after the FDD types .contactme into EuroScope, the plugin also clicks the aircraft for you,
# so the message is sent without a manual click (the mouse goes back where it was). autoclick=0 turns it off.
# highlight=1 (default): clicking an aircraft on the FDD circles it in white in EuroScope for 3 seconds. highlight=0 turns it off.
