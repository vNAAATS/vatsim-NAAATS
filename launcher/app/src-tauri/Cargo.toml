[package]
name = "vnaaats-app"
version = "0.1.0"
edition = "2021"
description = "The vNAAATS app: opens the Flight Data Display and sets up the plugin on this computer."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
keyring = { version = "3", features = ["windows-native"] }
vnaaats-core = { path = "../../core" }
